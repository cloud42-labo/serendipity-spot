org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.2はcompileSdk=36を正式サポート範囲外(8.9.1以降が必要)として警告を出すが、
# ビルド・テストは問題なく成功する。AGP/Gradleの本格アップグレードは別タスクとして
# 切り出し、Google Playの target API 36 期限(2026-08-31、SPOT-06-S01)には
# このsuppressで先に対応する。
android.suppressUnsupportedCompileSdk=36
