name: PR check

# PRの時点でビルドとユニットテストを回すためのワークフロー。
#
# 既存の serendipity-spot-android.yml は `push: branches: [main]` でしか動かない。
# つまりマージ前のPRにはCIの結果が1つも付かず、「CI greenを確認してからマージする」
# という運用が実際には確認できない状態だった。ここではPRに対してだけ動く軽い検証を
# 足す（APKの配布・リリース・タグ付けは一切しない。それらは従来どおり main への
# push 時のワークフローの役目）。
#
# 署名鍵は使わない。ここで見たいのは「コンパイルが通るか」「ユニットテストが通るか」
# だけで、配布物は作らないため。AGPが自動生成するデバッグ鍵で十分。

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Write local.properties
        # 秘密情報はPRの検証では使わない。地図キーが空でもビルドは通る
        # （実行時に地図が灰色になるだけで、コンパイル・テストには影響しない）。
        env:
          MAPS_API_KEY: ${{ secrets.SERENDIPITY_MAPS_API_KEY }}
        run: |
          {
            echo "MAPS_API_KEY=${MAPS_API_KEY}"
            echo "GOOGLE_SERVER_CLIENT_ID="
          } > local.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
